<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Notable&display=swap" rel="stylesheet">

    <style>
        .img-pequena {
            width: 30%;
            height: 240px;
        }

        .img-destaque {
            height: 300px;
            width: 90%;
            object-fit: cover;
        }

        img {
            border-radius: 10px;
            border: 2px dashed rgb(63, 42, 49);
        }

        .div-imagens {
            margin: 30px;
            border: 2px solid rgb(207, 163, 194);
            display: flex;
            justify-content: space-between;
        }

        body {
            background-color: rgb(247, 200, 219);
            text-align: center;
        }

        h1 {
            color: rgb(128, 52, 73);
            font-family: Notable, sans-serif;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1> Pusheen </h1>

    <div>
        <img class="img-destaque" src="pusheen cat.jpg" alt="Pusheen">
    </div>

    <div>
        <img class="img-pequena" src="Pusheen☆.jpg" alt="">
        <img class="img-pequena" src="seen.jpg" alt="">
        <img class="img-pequena" src="transferir.jpg" alt="">
    </div>

</body>
</html>

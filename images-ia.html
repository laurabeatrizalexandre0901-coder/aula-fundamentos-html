<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 Pusheen Kawaii 🌸</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Notable&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(180deg,#ffd9ec,#fff4f9,#ffe6f1);
    font-family:Arial, Helvetica, sans-serif;
    text-align:center;
    overflow-x:hidden;
}


/* Pétalas de cerejeira caindo */

.petalas span{
    position:fixed;
    top:-10%;
    font-size:30px;
    opacity:.8;
    pointer-events:none;
    z-index:5;
    animation:cair 10s linear infinite;
}


.petalas span:nth-child(1){
    left:5%;
    animation-duration:8s;
}

.petalas span:nth-child(2){
    left:15%;
    animation-duration:12s;
    animation-delay:2s;
}

.petalas span:nth-child(3){
    left:25%;
    animation-duration:9s;
    animation-delay:4s;
}

.petalas span:nth-child(4){
    left:40%;
    animation-duration:11s;
    animation-delay:1s;
}

.petalas span:nth-child(5){
    left:55%;
    animation-duration:7s;
    animation-delay:3s;
}

.petalas span:nth-child(6){
    left:65%;
    animation-duration:10s;
    animation-delay:5s;
}

.petalas span:nth-child(7){
    left:75%;
    animation-duration:13s;
    animation-delay:2s;
}

.petalas span:nth-child(8){
    left:85%;
    animation-duration:9s;
    animation-delay:4s;
}

.petalas span:nth-child(9){
    left:92%;
    animation-duration:12s;
    animation-delay:1s;
}

.petalas span:nth-child(10){
    left:35%;
    animation-duration:14s;
    animation-delay:6s;
}


@keyframes cair{

    0%{
        transform:translateY(-100px) rotate(0deg);
    }

    50%{
        transform:translateY(50vh) translateX(80px) rotate(180deg);
    }

    100%{
        transform:translateY(110vh) translateX(-80px) rotate(360deg);
    }

}



/* Decorações */

.decoracao{
    position:fixed;
    font-size:35px;
    opacity:.8;
    animation:flutuar 5s ease-in-out infinite;
    pointer-events:none;
    z-index:6;
}

.d1{top:20px;left:30px;}
.d2{top:80px;right:50px;}
.d3{bottom:50px;left:40px;}
.d4{bottom:70px;right:40px;}
.d5{top:45%;left:10px;}
.d6{top:35%;right:10px;}


@keyframes flutuar{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }

}



/* Caixa principal */

.container{

    position:relative;
    z-index:10;

    width:90%;
    max-width:1100px;

    margin:40px auto;

    background:rgba(255,255,255,.85);

    backdrop-filter:blur(6px);

    border:5px dashed #ffb7d2;

    border-radius:30px;

    padding:30px;

    box-shadow:
    0 10px 30px rgba(255,120,170,.3);

}



/* Título */

h1{

    font-family:"Notable",sans-serif;

    color:#ff5f99;

    font-size:45px;

    text-shadow:3px 3px white;

    margin-bottom:15px;

}



.linha{

    font-size:22px;

    color:#d45c87;

    margin-bottom:25px;

}



/* Imagem principal */

.img-destaque{

    width:95%;

    max-width:900px;

    height:400px;

    object-fit:cover;

    border-radius:25px;

    border:6px solid white;

    box-shadow:
    0 0 20px pink;

    transition:.4s;

}


.img-destaque:hover{

    transform:scale(1.02);

}



/* Galeria */

.galeria{

    display:flex;

    justify-content:center;

    gap:25px;

    flex-wrap:wrap;

    margin-top:30px;

}



.img-pequena{

    width:280px;

    height:220px;

    object-fit:cover;

    border-radius:20px;

    border:5px solid white;

    box-shadow:
    0 8px 18px rgba(255,120,170,.35);

    transition:.4s;

}



.img-pequena:hover{

    transform:rotate(-3deg) scale(1.08);

}



/* Rodapé */

.rodape{

    margin-top:35px;

    font-size:22px;

    color:#ff6f9f;

}



.estrelinhas{

    font-size:28px;

    margin:15px 0;

}



</style>

</head>


<body>


<!-- Pétalas -->

<div class="petalas">

<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>
<span>🌸</span>

</div>



<!-- Decorações -->

<div class="decoracao d1">🌸</div>
<div class="decoracao d2">🎀</div>
<div class="decoracao d3">🩷</div>
<div class="decoracao d4">🌸</div>
<div class="decoracao d5">🎀</div>
<div class="decoracao d6">🩷</div>



<div class="container">


<h1>🌸 PUSHEEN 🌸</h1>


<p class="linha">
🎀 Bem-vindoo! 🎀
</p>


<div class="estrelinhas">
🌸 🩷 🌸 🩷 🌸 🩷
</div>



<img class="img-destaque" src="pusheen cat.jpg" alt="Pusheen">


<div class="galeria">

<img class="img-pequena" src="Pusheen☆.jpg" alt="">

<img class="img-pequena" src="seen.jpg" alt="">

<img class="img-pequena" src="transferir.jpg" alt="">


</div>



<div class="estrelinhas">

🍰 🌸 💕 ✨ 🩷 🍓

</div>



<p class="rodape">

♡ Feito com muito carinho para todos os fãs da Pusheen! ♡

</p>


</div>


</body>

</html>
